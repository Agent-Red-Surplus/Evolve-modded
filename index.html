<!DOCTYPE HTML>
<html>
<head>
    <title>Evolve</title>
    <meta http-equiv="Content-type" content="text/html;charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" href="evolved.ico" type="images/x-icon" media="(prefers-color-scheme:light)">

    <link rel="stylesheet" type="text/css" href="lib/weather-icons.min.css">

    <script src="https://unpkg.com/vue@2.7.14/dist/vue.min.js" integrity="sha384-05dHfbm/L0COkFLQ5ghEDllrtj0kD1/46h3bAPxuPjWq9/IDglEo6RtZefYkYfpk" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/buefy@0.9.22/dist/buefy.min.js" integrity="sha384-SsYfCnxxJJlTFm+xZU2q9KLeF0LureHv8EYGBhKyFNiAGP5ufOhhryh1fKVdq6N7" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/sortablejs@1.10.2/Sortable.min.js" integrity="sha384-6qM1TfKo1alBw3Uw9AWXnaY5h0G3ScEjxtUm4TwRJm7HRmDX8UfiDleTAEEg5vIe" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/chart.js@3.8.2/dist/chart.min.js" integrity="sha384-z7c1KnSCkMpfoib43Lq1v2pokQC8cdqBWmH2qiyH2KkmNv60hACtZUjoCEkp1Y08" crossorigin="anonymous"></script>
    <script src="lib/lz-string.min.js"></script>

    <!-- Live Mod Loader (Preserves Resource Dropdown + Clean Disable) -->
    <script>
        (() => {
            "use strict";
            const getState = (key, def) => {
                try {
                    const val = JSON.parse(window.localStorage.getItem(key));
                    return val === null ? def : val;
                } catch {
                    return def;
                }
            };
            const setState = (key, val) => {
                window.localStorage.setItem(key, JSON.stringify(val));
            };

            let autoEnabled = getState("mod_enable_automation", true);
            let speedEnabled = getState("mod_enable_speed", true);
            let menuVisible = getState("mod_menu_visible", true);
            let savedSpeed = getState("customSpeed", 1);

            let autoLoaded = false;
            let autoFetching = false;
            let autoBtn = null;

            // --- UPDATED DISABLE LOGIC START ---
            const hideStyle = document.createElement("style");
            hideStyle.id = "mod-hide-automation-style";
            hideStyle.textContent = `
                [data-ea-hidden="true"] {
                    display: none !important;
                }
            `;

            // Find only Evolve Automation's UI elements (tabs, settings panel, and resource quick-toggle dropdown)
            const toggleAutomationUI = (show) => {
                // 1. Main settings tab & content
                document.querySelectorAll(".b-tabs .tabs li").forEach(li => {
                    if (/automation/i.test(li.textContent)) {
                        if (show) li.removeAttribute("data-ea-hidden");
                        else li.setAttribute("data-ea-hidden", "true");
                    }
                });

                // 2. Automation panels & quick-enable dropdown under #resources
                document.querySelectorAll('[id*="automation" i], [id*="auto_" i], #resources .dropdown, #resources select').forEach(el => {
                    // Skip native game elements inside #resources (like market/crate controls if any) by checking for EA markers
                    const isNativeResource = el.closest("#resStorage") || el.closest("#market") || el.id === "resources";
                    if (isNativeResource) return;

                    if (show) el.removeAttribute("data-ea-hidden");
                    else el.setAttribute("data-ea-hidden", "true");
                });

                // 3. Switch away from Automation tab if user is viewing it when disabling
                if (!show) {
                    const activeTab = document.querySelector(".b-tabs .tabs li.is-active");
                    if (activeTab && /automation/i.test(activeTab.textContent)) {
                        const firstTab = document.querySelector('.b-tabs .tabs li:not([data-ea-hidden="true"]) a');
                        if (firstTab) origClick.call(firstTab);
                    }
                }
            };

            // Gate Evolve Automation's timers and clicks while autoEnabled is false
            const origSetInterval = window.setInterval;
            window.setInterval = function(fn, delay, ...args) {
                if (typeof fn === "function") {
                    const stack = (new Error()).stack || "";
                    if (stack.includes("evolve-automation-script") || stack.includes("eval")) {
                        const gatedFn = function(...innerArgs) {
                            if (!autoEnabled) return;
                            return fn.apply(this, innerArgs);
                        };
                        return origSetInterval.call(window, gatedFn, delay, ...args);
                    }
                }
                return origSetInterval.call(window, fn, delay, ...args);
            };

            const origClick = HTMLElement.prototype.click;
            HTMLElement.prototype.click = function(...args) {
                if (!autoEnabled) {
                    const stack = (new Error()).stack || "";
                    if (stack.includes("evolve-automation-script") || stack.includes("eval")) {
                        return;
                    }
                }
                return origClick.apply(this, args);
            };
            // --- UPDATED DISABLE LOGIC END ---

            const updateAutoButton = () => {
                if (!autoBtn) return;
                if (autoFetching) {
                    autoBtn.textContent = "Auto:...";
                    autoBtn.style.opacity = "0.7";
                } else {
                    autoBtn.textContent = `Auto:${autoEnabled ? "ON" : "OFF"}`;
                    autoBtn.style.opacity = autoEnabled ? "1" : "0.55";
                }
            };

            const setAutomationLive = (enable) => {
                if (autoFetching) return;
                autoEnabled = enable;
                setState("mod_enable_automation", enable);

                if (!enable) {
                    if (!hideStyle.parentNode) document.head.appendChild(hideStyle);
                    toggleAutomationUI(false);
                    updateAutoButton();
                    return;
                }

                // Enabling
                if (hideStyle.parentNode) hideStyle.parentNode.removeChild(hideStyle);

                if (autoLoaded) {
                    toggleAutomationUI(true);
                    updateAutoButton();
                    return;
                }

                autoFetching = true;
                updateAutoButton();
                fetch("https://cdn.jsdelivr.net/gh/lamia-zamia/Evolve-Automation@master/evolve_automation.user.js?v=" + Date.now())
                    .then(r => r.text())
                    .then(code => {
                        const s = document.createElement("script");
                        s.id = "evolve-automation-script";
                        s.textContent = code.replace(/^\/\/ ==UserScript==[\s\S]*?\/\/ ==\/UserScript==/, "");
                        document.head.appendChild(s);
                        autoLoaded = true;
                        autoFetching = false;
                        if (!autoEnabled) {
                            setTimeout(() => {
                                if (!hideStyle.parentNode) document.head.appendChild(hideStyle);
                                toggleAutomationUI(false);
                            }, 400);
                        }
                        updateAutoButton();
                    })
                    .catch(() => {
                        autoFetching = false;
                        autoEnabled = false;
                        setState("mod_enable_automation", false);
                        updateAutoButton();
                    });
            };

            // Speed Multiplier Setup (runs after Auto Mod starts)
            let speedReady = false;
            let fromScript = false;
            let vueMethod = null;
            let speedSpan = null;

            const oldPost = Worker.prototype.postMessage;
            Worker.prototype.postMessage = function(...args) {
                const activeMultiplier = (speedEnabled && speedReady) ? savedSpeed : 1;
                if (args[0] && args[0].period) {
                    args[0].period = args[0].period / activeMultiplier;
                }
                oldPost.apply(this, args);
                if (fromScript) {
                    setTimeout(() => {
                        if (vueMethod) vueMethod.pause();
                    }, 0);
                    fromScript = false;
                }
            };

            const applySpeedWorker = () => {
                if (vueMethod && !vueMethod._data.s.pause) {
                    fromScript = true;
                    vueMethod.pause();
                }
            };

            const updateSpeedUI = () => {
                if (!speedSpan) return;
                speedSpan.style.display = speedEnabled ? "" : "none";
                speedSpan.textContent = `speed ×${savedSpeed}`;
            };

            const setSpeedLive = (enable) => {
                speedEnabled = enable;
                setState("mod_enable_speed", enable);
                updateSpeedUI();
                applySpeedWorker();
            };

            // Boot sequence: Wait for game UI, load Auto Mod FIRST, then Speed Mod & Top-Bar Menu
            const bootTimer = origSetInterval.call(window, () => {
                const versionLog = document.getElementById("versionLog");
                const topBar = document.querySelector("#topBar");
                const mainTab = document.querySelector(".b-tabs .tabs ul");
                if (!versionLog || !topBar || !topBar.__vue__ || !mainTab) return;
                origClearInterval.call(window, bootTimer);

                vueMethod = topBar.__vue__;

                // Step 1: Load Evolve Automation FIRST if enabled
                if (autoEnabled) {
                    setAutomationLive(true);
                }

                // Step 2: Initialize Speed Multiplier right after
                setTimeout(() => {
                    speedSpan = document.createElement("span");
                    speedSpan.id = "customSpeed";
                    speedSpan.className = "version";
                    speedSpan.style.cursor = "pointer";
                    speedSpan.style.marginRight = "0.75rem";
                    speedSpan.addEventListener("click", () => {
                        const input = prompt("Multiply default game speed by:", savedSpeed);
                        if (input === null) return;
                        savedSpeed = Math.max(Number(input) || 1, 1);
                        setState("customSpeed", savedSpeed);
                        updateSpeedUI();
                        applySpeedWorker();
                    });

                    versionLog.parentNode.insertBefore(speedSpan, versionLog);
                    speedReady = true;
                    updateSpeedUI();
                    if (speedEnabled) applySpeedWorker();
                }, 500);

                // Step 3: Build Top-Bar Show/Hide Menu & Single-Click Toggles
                const wrapper = document.createElement("span");
                wrapper.id = "mod-top-bar-wrapper";
                wrapper.className = "version";
                wrapper.style.marginRight = "0.75rem";
                wrapper.style.display = "inline-flex";
                wrapper.style.alignItems = "center";
                wrapper.style.gap = "6px";

                const menuItems = document.createElement("span");
                menuItems.style.display = menuVisible ? "inline-flex" : "none";
                menuItems.style.gap = "6px";

                autoBtn = document.createElement("span");
                autoBtn.style.cursor = "pointer";
                autoBtn.style.textDecoration = "underline";
                updateAutoButton();
                autoBtn.addEventListener("click", () => {
                    setAutomationLive(!autoEnabled);
                });

                const speedBtn = document.createElement("span");
                speedBtn.style.cursor = "pointer";
                speedBtn.style.textDecoration = "underline";
                const refreshSpeedLabel = () => {
                    speedBtn.textContent = `Speed:${speedEnabled ? "ON" : "OFF"}`;
                    speedBtn.style.opacity = speedEnabled ? "1" : "0.55";
                };
                refreshSpeedLabel();
                speedBtn.addEventListener("click", () => {
                    setSpeedLive(!speedEnabled);
                    refreshSpeedLabel();
                });

                const toggleMenuBtn = document.createElement("span");
                toggleMenuBtn.style.cursor = "pointer";
                toggleMenuBtn.title = "Show/Hide Mod Menu (Alt+M)";
                const refreshMenuVis = () => {
                    menuItems.style.display = menuVisible ? "inline-flex" : "none";
                    toggleMenuBtn.textContent = menuVisible ? "[Hide Mods]" : "[Mods]";
                };
                refreshMenuVis();
                toggleMenuBtn.addEventListener("click", () => {
                    menuVisible = !menuVisible;
                    setState("mod_menu_visible", menuVisible);
                    refreshMenuVis();
                });

                window.addEventListener("keydown", (e) => {
                    if (e.altKey && e.key.toLowerCase() === "m") {
                        e.preventDefault();
                        toggleMenuBtn.click();
                    }
                });

                menuItems.appendChild(autoBtn);
                menuItems.appendChild(speedBtn);
                wrapper.appendChild(menuItems);
                wrapper.appendChild(toggleMenuBtn);
                versionLog.parentNode.insertBefore(wrapper, versionLog);
            }, 200);
        })();
    </script>

    <script src="evolve/main.js" type="module"></script>
</head>
<body>
    <style>
        .loading {
            text-align: center;
            margin-top: 10rem;
        }
        .lds-dual-ring {
            display: inline-block;
            width: 64px;
            height: 64px;
        }
        .lds-dual-ring:after {
            content: " ";
            display: block;
            width: 5rem;
            height: 5rem;
            margin: 1px;
            border-radius: 50%;
            border: 5px solid #fff;
            border-color: #fff transparent #fff transparent;
            animation: lds-dual-ring 1.2s linear infinite;
            }
            @keyframes lds-dual-ring {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    <div class="loading"><div class="lds-dual-ring"></div></div>
