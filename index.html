<!DOCTYPE HTML>
<html>
<head>
    <title>Evolve</title>
    <meta http-equiv="Content-type" content="text/html;charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="evolved-light.ico" type="images/x-icon" media="(prefers-color-scheme:dark)">
    <link rel="icon" href="evolved.ico" type="images/x-icon" media="(prefers-color-scheme:light)">
    <link rel="icon" href="evolved.ico" type="images/x-icon" media="(prefers-color-scheme:no-preference)">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato&display=swap">
    <link rel="stylesheet" href="lib/buefy.min.0.9.22.css">
    <link rel="stylesheet" type="text/css" href="lib/weather-icons.min.css">
    <link rel="stylesheet" type="text/css" href="evolve/evolve.css">
    <script src="https://unpkg.com/jquery@3.6.3/dist/jquery.min.js" integrity="sha384-Ft/vb48LwsAEtgltj7o+6vtS2esTU9PCpDqcXs4OCVQFZu5BqprHtUCZ4kjK+bpE" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@2.7.14/dist/vue.min.js" integrity="sha384-05dHfbm/L0COkFLQ5ghEDllrtj0kD1/46h3bAPxuPjWq9/IDglEo6RtZefYkYfpk" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/buefy@0.9.22/dist/buefy.min.js" integrity="sha384-SsYfCnxxJJlTFm+xZU2q9KLeF0LureHv8EYGBhKyFNiAGP5ufOhhryh1fKVdq6N7" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/sortablejs@1.10.2/Sortable.min.js" integrity="sha384-6qM1TfKo1alBw3Uw9AWXnaY5h0G3ScEjxtUm4TwRJm7HRmDX8UfiDleTAEEg5vIe" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/chart.js@3.8.2/dist/chart.min.js" integrity="sha384-z7c1KnSCkMpfoib43Lq1v2pokQC8cdqBWmH2qiyH2KkmNv60hACtZUjoCEkp1Y08" crossorigin="anonymous"></script>
    <script src="lib/lz-string.min.js"></script>

    <!-- Mod Manager & Speed Multiplier (Runs before main.js to hook game Worker) -->
    <script>
        (() => {
            "use strict";
            const getModState = (key, def) => {
                try {
                    const val = JSON.parse(window.localStorage.getItem(key));
                    return val === null ? def : val;
                } catch {
                    return def;
                }
            };
            const setModState = (key, val) => {
                window.localStorage.setItem(key, JSON.stringify(val));
            };

            window.__evolveMods = {
                automation: getModState("mod_enable_automation", true),
                speed: getModState("mod_enable_speed", true),
                getModState,
                setModState
            };

            if (window.__evolveMods.speed) {
                let customSpeed = getModState("customSpeed", 1);
                let fromScript = false;
                let vueMethod;

                const oldPost = Worker.prototype.postMessage;
                Worker.prototype.postMessage = function(...args) {
                    if (args[0] && args[0].period) {
                        args[0].period = args[0].period / customSpeed;
                    }
                    oldPost.apply(this, args);
                    if (fromScript) {
                        setTimeout(() => {
                            if (vueMethod) {
                                vueMethod.pause();
                            }
                        }, 0);
                        fromScript = false;
                    }
                };

                const hijackWorker = () => {
                    if (vueMethod && !vueMethod._data.s.pause) {
                        fromScript = true;
                        vueMethod.pause();
                    }
                };

                const updateSpeedDisplay = (speedSpan) => {
                    speedSpan.textContent = `speed ×${customSpeed}`;
                };

                const timer = setInterval(() => {
                    const versionLog = document.getElementById("versionLog");
                    const topBar = document.querySelector("#topBar");
                    if (!versionLog || !topBar || !topBar.__vue__) {
                        return;
                    }
                    clearInterval(timer);

                    const speedSpan = document.createElement("span");
                    speedSpan.id = "customSpeed";
                    speedSpan.className = "version";
                    speedSpan.style.cursor = "pointer";
                    speedSpan.style.marginRight = "0.75rem";
                    updateSpeedDisplay(speedSpan);

                    speedSpan.addEventListener("click", () => {
                        const input = prompt("Multiply default game speed by:", customSpeed);
                        if (input === null) return;
                        const newSpeed = Math.max(Number(input) || 1, 1);
                        customSpeed = newSpeed;
                        setModState("customSpeed", newSpeed);
                        updateSpeedDisplay(speedSpan);
                        hijackWorker();
                    });

                    versionLog.parentNode.insertBefore(speedSpan, versionLog);
                    vueMethod = topBar.__vue__;
                    hijackWorker();
                }, 100);
            }
        })();
    </script>

    <script src="evolve/main.js" type="module"></script>
</head>
<body>
    <style>
        .loading {
            text-align: center;
            margin-top: 10rem;
        }
        .lds-dual-ring {
            display: inline-block;
            width: 64px;
            height: 64px;
        }
        .lds-dual-ring:after {
            content: " ";
            display: block;
            width: 5rem;
            height: 5rem;
            margin: 1px;
            border-radius: 50%;
            border: 5px solid #fff;
            border-color: #fff transparent #fff transparent;
            animation: lds-dual-ring 1.2s linear infinite;
            }
            @keyframes lds-dual-ring {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        #mod-control-box {
            position: fixed;
            bottom: 10px;
            right: 10px;
            z-index: 9999;
            background: rgba(25, 25, 30, 0.92);
            color: #f0f0f0;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 6px 10px;
            font-family: 'Lato', sans-serif;
            font-size: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        #mod-control-box summary {
            cursor: pointer;
            font-weight: bold;
            user-select: none;
        }
        #mod-control-panel {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid #444;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #mod-control-panel label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
    </style>
    <div class="loading"><div class="lds-dual-ring"></div></div>

    <!-- On-Demand Mod Toggle Panel -->
    <details id="mod-control-box">
        <summary>Mods</summary>
        <div id="mod-control-panel">
            <label>
                <input type="checkbox" id="toggle-mod-automation">
                Evolve Automation
            </label>
            <label>
                <input type="checkbox" id="toggle-mod-speed">
                Speed Multiplier
            </label>
        </div>
    </details>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CPC46V71CB"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-CPC46V71CB');
    </script>

    <!-- Load Evolve Automation & Wire Up Toggles -->
    <script>
        window.addEventListener('load', () => {
            const mods = window.__evolveMods;
            const autoBox = document.getElementById('toggle-mod-automation');
            const speedBox = document.getElementById('toggle-mod-speed');

            autoBox.checked = mods.automation;
            speedBox.checked = mods.speed;

            autoBox.addEventListener('change', (e) => {
                mods.setModState('mod_enable_automation', e.target.checked);
                window.location.reload();
            });

            speedBox.addEventListener('change', (e) => {
                mods.setModState('mod_enable_speed', e.target.checked);
                window.location.reload();
            });

            if (mods.automation) {
                fetch('https://cdn.jsdelivr.net/gh/lamia-zamia/Evolve-Automation@master/evolve_automation.user.js?v=' + Date.now())
                    .then(r => r.text())
                    .then(code => {
                        const s = document.createElement('script');
                        s.textContent = code.replace(/^\/\/ ==UserScript==[\s\S]*?\/\/ ==\/UserScript==/, '');
                        document.head.appendChild(s);
                    });
            }
        });
    </script>
</body>
</html>
